[tool.poetry]
name = "streamstats"
version = "1.0.0"
packages = [{ include = "streamstats", from = "src" }]
include = [
    { path = "src/streamstats/*.json", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = "^3.14"
typer="^0.20.0"
huggingface-hub="^1.1.4"
pydantic = "^2.12.5"
python-dotenv = "^1.1.1"
pytest-dependency = "^0.6.0"
allure-pytest = "^2.15.2"
tenacity = "^9.0.0"
python-linq = "^2.0.4"
beautifulsoup4 = "^4.14.3"
assertpy = "^1.1"
loguru="^0.7.3"
pytest = "^9.1.1"
uvicorn = "^0.54.0"
requests = "^2.34.2"
psutil = "^7.2.2"
click = "^8.5.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^2.20.0"
black = "^22.10.0"
ruff="^0.1.9"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120
target-version = ['py312']


[tool.ruff]
fix = false
target-version = "py312"
line-length = 120


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120


[tool.ruff.lint.isort]
case-sensitive = true
force-single-line=true
lines-between-types = 1
no-sections = false

[tool.poetry.scripts]
test = "pytest:console_main"